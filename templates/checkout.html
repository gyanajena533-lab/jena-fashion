{% extends 'base.html' %}{% block content %}<main class="content"><h1>Checkout</h1><form class="form-panel fields" method="post"><input name="name" placeholder="Full name" value="{{current_user.name}}" required><input name="phone" placeholder="Mobile number" required><textarea name="address" placeholder="Full delivery address" required></textarea><label>Payment method</label><select name="payment"><option value="cod">Cash on Delivery</option><option value="online">Online payment (not activated)</option></select><h3>Order total: ₹{{total_price}}</h3><button>Place order</button></form></main>{% endblock %}
