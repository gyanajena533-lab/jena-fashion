{% extends 'base.html' %}{% block content %}<main class="content"><form class="form-panel fields" method="post"><h1>{% if product.id %}Edit{% else %}Add{% endif %} product</h1><input name="name" placeholder="Product name" value="{{product.name or ''}}" required><select name="category"><option value="saree" {% if product.category=='saree' %}selected{% endif %}>Saree</option><option value="kurta" {% if product.category=='kurta' %}selected{% endif %}>Kurta / Suit</option><option value="dress" {% if product.category=='dress' %}selected{% endif %}>Festive wear</option></select><textarea name="description" placeholder="Description">{{product.description or ''}}</textarea><input type="number" name="price" min="1" placeholder="Selling price" value="{{product.price or ''}}" required><input type="number" name="old_price" min="0" placeholder="Original price" value="{{product.old_price or ''}}"><input name="image" placeholder="Image URL" value="{{product.image or ''}}"><input name="tag" placeholder="Tag e.g. NEW" value="{{product.tag or ''}}"><input type="number" name="stock" min="0" placeholder="Stock quantity" value="{{product.stock if product.id else 10}}" required><button>Save product</button></form></main>{% endblock %}
