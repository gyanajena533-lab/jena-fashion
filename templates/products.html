{% extends 'base.html' %}{% block title %}Shop | Jena Fashion{% endblock %}{% block content %}<main class="content"><h1>Shop our collection</h1><form class="row" method="get"><input name="q" value="{{q}}" placeholder="Search products"><select name="category"><option value="">All categories</option>{% for c in categories %}<option value="{{c}}" {% if category==c %}selected{% endif %}>{{c|title}}</option>{% endfor %}</select><button>Filter</button></form><div class="grid-products">{% for p in products %}<article class="item-panel"><a href="{{url_for('product_detail',pid=p.id)}}"><img src="{{p.image}}" alt="{{p.name}}"><h3>{{p.name}}</h3></a><p class="price">₹{{p.price}}</p><a class="btn" href="{{url_for('product_detail',pid=p.id)}}">View details</a></article>{% else %}<p>No matching products found.</p>{% endfor %}</div></main>{% endblock %}
